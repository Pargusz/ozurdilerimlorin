<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Özür dilerim üstün zekalı kız 💜</title>
  <meta name="description" content="Affeder misin lufeeeen Lorin? 🥺">
  <meta name="theme-color" content="#ffe3ef">

  <meta property="og:type" content="website">
  <meta property="og:url" content="https://pargusz.github.io/ozurdilerimlorin/">
  <meta property="og:title" content="Özür dilerim üstün zekalı kız 💜">
  <meta property="og:description" content="Affeder misin lufeeeen Lorin? 🥺">
  <meta property="og:image" content="https://pargusz.github.io/ozurdilerimlorin/img/og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
  <div class="hearts" aria-hidden="true"></div>

  <main class="page">
    <div class="stickers stickers--a">
      <figure class="sticker" style="--w:.56; --r:-7deg; --dy:6px;  --dur:6.4s; --delay:-1.2s; --i:0">
        <img src="img/kedi-sovalye.webp" alt="Kılıçlı, zırhlı şövalye kedi" width="260" height="615">
      </figure>
      <figure class="sticker" style="--w:1;   --r:5deg;  --dy:-8px; --dur:7.1s; --delay:-3.4s; --i:1">
        <img src="img/domuz-ayicik.webp" alt="Ayıcıklı kostümlü domuzcuk" width="536" height="570">
      </figure>
      <figure class="sticker" style="--w:.86; --r:-4deg; --dy:10px; --dur:5.8s; --delay:-.6s;  --i:2">
        <img src="img/hamster-kizgin.webp" alt="Kızgın hamster" width="332" height="272">
      </figure>
      <figure class="sticker" style="--w:.9;  --r:6deg;  --dy:-4px; --dur:6.8s; --delay:-2.2s; --i:3">
        <img src="img/ayi-lolipop.webp" alt="Lolipoplu mor ayıcık" width="458" height="620">
      </figure>
    </div>

    <header class="head">
      <p class="to">💌 Lorin'e</p>
      <h1>
        <span class="l1">Özür dilerim</span>
        <span class="l2">üstün zekalı kız</span>
      </h1>

      <div class="note">
        <p>Normalde etrafa bir sürü çiçek koyacaktım ama <span class="nowrap">“alerjim var”</span> demiştin… 🤧</p>
        <p>O yüzden çiçek yerine <strong>bizim resimleri</strong> koydum 🐷💜</p>
      </div>
    </header>

    <div class="stickers stickers--b">
      <figure class="sticker" style="--w:.9;  --r:-5deg; --dy:-6px; --dur:6.2s; --delay:-2.8s; --i:4">
        <img src="img/domuz-papatya.webp" alt="Şapkalı, papatyalı domuzcuk" width="391" height="546">
      </figure>
      <figure class="sticker" style="--w:.68; --r:7deg;  --dy:8px;  --dur:5.6s; --delay:-1.7s; --i:5">
        <img src="img/ayi-mor.webp" alt="Mor ayıcık" width="168" height="268">
      </figure>
      <figure class="sticker" style="--w:1;   --r:-3deg; --dy:2px;  --dur:7.4s; --delay:-4.1s; --i:6">
        <img src="img/domuz-oyuncu.webp" alt="Oyun kumandalı domuzcuk" width="620" height="563">
      </figure>
      <figure class="sticker" style="--w:.84; --r:4deg;  --dy:-10px; --dur:6.6s; --delay:-.3s; --i:7">
        <img src="img/ayi-sarilma.webp" alt="Oyuncak ayısına sarılan mor ayıcık" width="407" height="620">
      </figure>
      <figure class="sticker" style="--w:.95; --r:-6deg; --dy:6px;  --dur:7.8s; --delay:-5.2s; --i:8">
        <img src="img/ayi-uyku.webp" alt="Uyuyan mor ayıcık" width="501" height="620">
      </figure>
    </div>

    <section class="ask" aria-live="polite">
      <h2 id="question">Affeder misin <span class="plz">lufeeeen</span> <span class="name">Lorin</span>? 🥺</h2>
      <div class="buttons" id="buttons">
        <button type="button" class="btn yes" id="yes">Evet 💜</button>
        <button type="button" class="btn no" id="no">Hayır</button>
      </div>

      <div class="yay" id="yay" hidden>
        <img src="img/ayi-sarilma.webp" alt="" width="407" height="620">
        <p class="yay-title">Yaşasııın! 🥹💜</p>
        <p class="yay-text">Biliyordum affedersin, üstün zekalı kız.</p>
      </div>
    </section>
  </main>

  <script src="app.js?v=3"></script>
</body>
</html>
